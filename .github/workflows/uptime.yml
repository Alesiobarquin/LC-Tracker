name: Production uptime
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check site and core providers
        run: |
          curl --fail --silent --show-error --retry 2 --max-time 20 https://lc-tracker.app/ > /dev/null
          curl --fail --silent --show-error --retry 2 --max-time 20 https://lc-tracker.app/api/health
